name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # the Python side lives in backend/; steps that need the repo root override this
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # opencv-python (not -headless) needs libGL even for import
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # CPU wheels explicitly: the default index serves the CUDA build of
      # torch (~2 GB) which CI has no use for. Installing it first satisfies
      # the requirement before the main install resolves it.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: ruff check .

      # from the repo root: git ls-files only lists files below the current folder
      - name: Repo weight guard
        working-directory: .
        run: python backend/scripts/check_repo_weight.py --all

      - run: pytest

      # The end-to-end selftest composites real reference card images into
      # synthetic scenes, so it needs the local TCGdex cache. Card images are
      # deliberately not committed (see .gitignore); cache the download so we
      # only hit TCGdex on a cold cache.
      - name: Restore card-image cache (TCGdex base1)
        uses: actions/cache@v4
        with:
          path: |
            backend/data/cards/images
            backend/data/cards/meta
            backend/data/cards/set.json
            backend/data/cards/ids.txt
            backend/data/cards/urls.txt
          key: tcgdex-base1-v2

      - name: Download card set on cold cache
        run: |
          count=$(ls data/cards/images 2>/dev/null | wc -l)
          if [ "$count" -lt 100 ]; then
            bash scripts/download_card_set.sh
          else
            echo "cache hit: $count images"
          fi

      # The figurine gates run against the committed index with the embedder
      # stubbed, so they need no DINOv2 weights download and no network.
      - name: Headless end-to-end selftest
        run: python scripts/selftest.py
